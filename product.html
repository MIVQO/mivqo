
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loading Product | MIVQO</title>
  <meta name="description" content="Discover quality products at MIVQO.">
  <meta name="robots" content="index, follow">

  <link rel="canonical" href="https://mivqo.github.io/mivqo/">

  <meta property="og:site_name" content="MIVQO">
  <meta property="og:type" content="product">
  <meta property="og:title" content="MIVQO">
  <meta property="og:description" content="Discover quality products at MIVQO.">
  <meta property="og:image" content="https://mivqo.github.io/mivqo/images/logo.png.jpeg">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f8fa;
      color: #171717;
    }

    header {
      padding: 20px 7%;
      background: #fff;
      border-bottom: 1px solid #eee;
    }

    .logo {
      color: #111;
      font-size: 27px;
      font-weight: 800;
      text-decoration: none;
      letter-spacing: 2px;
    }

    main {
      max-width: 1050px;
      margin: 45px auto;
      padding: 20px;
    }

    .product {
      background: white;
      border-radius: 16px;
      padding: 28px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 35px;
      box-shadow: 0 5px 25px #00000008;
    }

    .product img {
      width: 100%;
      max-height: 450px;
      object-fit: contain;
      border-radius: 12px;
      background: #f8f8f8;
    }

    h1 {
      font-size: 30px;
      margin: 5px 0 15px;
    }

    .price {
      font-size: 27px;
      font-weight: 700;
      margin: 20px 0;
    }

    .description {
      color: #666;
      line-height: 1.7;
    }

    .category {
      color: #777;
      font-size: 14px;
    }

    .buy {
      display: inline-block;
      margin-top: 20px;
      padding: 15px 30px;
      background: #111;
      color: white;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }

    .buy:hover {
      background: #16834a;
    }

    #message {
      text-align: center;
      padding: 60px 15px;
      line-height: 1.7;
      color: #555;
    }

    .back {
      display: inline-block;
      margin-top: 20px;
      color: #16834a;
      text-decoration: none;
      font-weight: bold;
    }

    @media(max-width: 700px) {
      .product {
        grid-template-columns: 1fr;
        padding: 18px;
      }

      h1 {
        font-size: 24px;
      }

      main {
        margin: 20px auto;
      }
    }
  </style>
</head>

<body>

  <header>
    <a class="logo" href="index.html">MIVQO</a>
  </header>

  <main>

    <div id="message">
      Loading product...
    </div>

    <div class="product" id="product" hidden>

      <div>
        <img id="productImage" alt="">
      </div>

      <div>
        <p class="category" id="category"></p>

        <h1 id="name"></h1>

        <div class="price" id="price"></div>

        <p class="description" id="description"></p>

        <a
          class="buy"
          id="buyButton"
          href="#"
          target="_blank"
          rel="noopener noreferrer"
        >
          Buy Now
        </a>

        <br>

        <a class="back" href="index.html">
          ← Continue Shopping
        </a>
      </div>

    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>

    // SUPABASE CONFIGURATION

    const SUPABASE_URL =
      "https://ysufdooypagdusicjrfv.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_gIRNdakUJshJhb3UGzu4sg_e0GLMcsO";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // =====================================
    // MIVQO VISITOR TRACKING
    // =====================================

    async function trackProductVisit(productId) {

      try {

        let visitorId = localStorage.getItem("mivqo_visitor_id");

        if (!visitorId) {
          visitorId = crypto.randomUUID();
          localStorage.setItem("mivqo_visitor_id", visitorId);
        }

        const { error } = await supabaseClient
          .from("site_visits")
          .insert({
            visitor_id: visitorId,
            page_path: window.location.pathname,
            product_id: productId
          });

        if (error) {
          console.error("Product tracking error:", error);
        }

      } catch (error) {

        console.error("Product tracking failed:", error);

      }

    }


    // LOAD PRODUCT

    async function loadProduct() {

      const id = new URLSearchParams(
        window.location.search
      ).get("id");

      const message = document.getElementById("message");

      if (!id) {
        message.textContent =
          "Product ID is missing from the URL.";

        return;
      }

      try {

        const { data, error } = await supabaseClient
          .from("products")
          .select("*")
          .eq("id", id)
          .maybeSingle();


        // DATABASE ERROR

        if (error) {

          console.error("Supabase Product Error:", error);

          message.textContent =
            "Database Error: " + error.message;

          return;
        }


        // PRODUCT NOT FOUND

        if (!data) {

          message.textContent =
            "Product ID not found: " + id;

          return;
        }


        // CHECK PRODUCT STATUS

        if (data.is_active !== true) {

          message.textContent =
            "This product is currently inactive.";

          return;
        }


        const product = data;


        // TRACK VALID PRODUCT VISIT

        trackProductVisit(product.id);


        const title =
          product.seo_title || product.name;

        const description =
          product.seo_description ||
          product.description ||
          "Discover this product at MIVQO.";


        // SEO TITLE

        document.title = title + " | MIVQO";


        // SEO DESCRIPTION

        document.querySelector(
          'meta[name="description"]'
        ).setAttribute("content", description);


        // CANONICAL URL

        document.querySelector(
          'link[rel="canonical"]'
        ).setAttribute(
          "href",
          window.location.origin +
          window.location.pathname +
          window.location.search
        );


        // OPEN GRAPH

        document.querySelector(
          'meta[property="og:title"]'
        ).setAttribute("content", title);

        document.querySelector(
          'meta[property="og:description"]'
        ).setAttribute("content", description);

        document.querySelector(
          'meta[property="og:image"]'
        ).setAttribute(
          "content",
          product.image_url || ""
        );


        // PRODUCT INFORMATION

        document.getElementById("name").textContent =
          product.name || "MIVQO Product";

        document.getElementById("price").textContent =
          "₹" + product.price;

        document.getElementById("description").textContent =
          product.description || "";

        document.getElementById("category").textContent =
          product.category || "";


        // PRODUCT IMAGE

        const image =
          document.getElementById("productImage");

        image.src = product.image_url || "";

        image.alt =
          product.image_alt || product.name || "MIVQO Product";


        // BUY BUTTON

        const buyButton =
          document.getElementById("buyButton");


        if (
          product.product_type === "affiliate" &&
          product.affiliate_url
        ) {

          buyButton.href = product.affiliate_url;

          buyButton.textContent = "Buy Now";

        } else {

          const number = "919496714212";

          const text =
            `Hi MIVQO, I am interested in ${product.name}. Price: ₹${product.price}`;

          buyButton.href =
            `https://wa.me/${number}?text=${encodeURIComponent(text)}`;

          buyButton.textContent =
            "Order on WhatsApp";

        }


        // PRODUCT STRUCTURED DATA

        const schema = {

          "@context": "https://schema.org/",

          "@type": "Product",

          "name": product.name,

          "description": description,

          "image": product.image_url
            ? [product.image_url]
            : [],

          "offers": {

            "@type": "Offer",

            "priceCurrency": "INR",

            "price": product.price,

            "availability":
              "https://schema.org/InStock"

          }

        };


        const schemaScript =
          document.createElement("script");

        schemaScript.type =
          "application/ld+json";

        schemaScript.textContent =
          JSON.stringify(schema);

        document.head.appendChild(schemaScript);


        // SHOW PRODUCT

        message.hidden = true;

        document.getElementById("product").hidden =
          false;


      } catch (error) {

        console.error("Product Page Error:", error);

        message.textContent =
          "Error: " + error.message;

      }

    }


    // START

    loadProduct();

  </script>

</body>
</html>
